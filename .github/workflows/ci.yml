name: CI

on:
  push:
    branches: [ main, master_plan ]
  pull_request:
    branches: [ main, master_plan ]

jobs:
  lua-api-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check every Lua-callable primitive is tagged for docs generation
        run: python3 scripts/generate_lua_api_docs.py

  # Scarab, sunlight, raylib, libtmx and Lua all built with AddressSanitizer, and every headless
  # check run under it with LeakSanitizer on (plans/MASTER_PLAN.md item R1, mirroring sunlight's own
  # "AddressSanitizer (Linux)" job): the smoke tests, the headless smoke test and every sample.
  # Linux only - macOS's AddressSanitizer has no LeakSanitizer, and one platform keeps CI time down.
  # Any sanitizer report fails the job (scripts/asan_run.py); known third-party leaks are suppressed
  # only through scripts/lsan.supp, each with its reason.
  asan:
    name: AddressSanitizer (Linux)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zlib1g-dev \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Configure with AddressSanitizer
        env:
          SCARAB_CI_CONTENT_KEY: ${{ secrets.SCARAB_CI_CONTENT_KEY }}
          ASAN_FLAGS: -fsanitize=address -fno-omit-frame-pointer -g
        run: >
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Debug -DCMAKE_POLICY_VERSION_MINIMUM=3.5
          -DSCARAB_CONTENT_KEY="$SCARAB_CI_CONTENT_KEY" -DSCARAB_BUILD_TESTS=ON
          "-DCMAKE_C_FLAGS=$ASAN_FLAGS" "-DCMAKE_CXX_FLAGS=$ASAN_FLAGS"
          "-DCMAKE_EXE_LINKER_FLAGS=-fsanitize=address" "-DCMAKE_SHARED_LINKER_FLAGS=-fsanitize=address"

      - name: Build
        run: cmake --build build -j 4

      - name: Unit tests under AddressSanitizer and LeakSanitizer
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1:abort_on_error=1
          LSAN_OPTIONS: suppressions=scripts/lsan.supp
        run: ./build/scarab_tests

      - name: Run every headless check under AddressSanitizer and LeakSanitizer
        run: python3 scripts/asan_run.py build/scarab --require-encrypted

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zlib1g-dev \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Windows dependencies (zlib, iconv via vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install zlib:x64-windows libiconv:x64-windows

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          SCARAB_CI_CONTENT_KEY: ${{ secrets.SCARAB_CI_CONTENT_KEY }}
        run: cmake -B build -S . -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSCARAB_BUILD_TESTS=ON -DSCARAB_CONTENT_KEY="$SCARAB_CI_CONTENT_KEY"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SCARAB_CI_CONTENT_KEY: ${{ secrets.SCARAB_CI_CONTENT_KEY }}
        run: cmake -B build -S . "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DSCARAB_BUILD_TESTS=ON" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DSCARAB_CONTENT_KEY=$env:SCARAB_CI_CONTENT_KEY"

      - name: Verify SCARAB_CONTENT_KEY actually configured (Linux/macOS)
        if: runner.os != 'Windows'
        # Checks the cached value's own LENGTH only (64 hex chars expected) -
        # never the value itself, so nothing here can leak the secret even
        # by accident. ci.yml has no test/run step to otherwise prove the
        # secret really flowed through (a silently-empty key would build
        # identically to a real one - no visible difference in this log
        # either way) - this is what actually closes that gap.
        run: |
          KEY_LEN=$(grep '^SCARAB_CONTENT_KEY:STRING=' build/CMakeCache.txt | cut -d= -f2 | tr -d '\n' | wc -c | tr -d ' ')
          echo "SCARAB_CONTENT_KEY configured length: $KEY_LEN (expected 64)"
          if [ "$KEY_LEN" != "64" ]; then
            echo "::error::SCARAB_CONTENT_KEY is not a 64-hex-char value - SCARAB_CI_CONTENT_KEY secret missing/misconfigured?"
            exit 1
          fi

      - name: Verify SCARAB_CONTENT_KEY actually configured (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $match = Select-String -Path build\CMakeCache.txt -Pattern '^SCARAB_CONTENT_KEY:STRING='
          # .Line is the matched line's own raw text ("SCARAB_CONTENT_KEY:STRING=<value>") -
          # $match itself is a MatchInfo object, and stringifying THAT directly (eg. via
          # -replace on $match rather than $match.Line) yields PowerShell's own
          # "<path>:<linenumber>:<line text>" representation instead, inflating the
          # length by that prefix - a real bug caught live via this exact check
          # (reported 134, not 64, on the very first CI run).
          $keyLen = ($match.Line -replace '^SCARAB_CONTENT_KEY:STRING=', '').Length
          Write-Host "SCARAB_CONTENT_KEY configured length: $keyLen (expected 64)"
          if ($keyLen -ne 64) {
            Write-Host "::error::SCARAB_CONTENT_KEY is not a 64-hex-char value - SCARAB_CI_CONTENT_KEY secret missing/misconfigured?"
            exit 1
          }

      - name: Build
        run: cmake --build build --config Release -j 4

      # The code follows docs/CODE_STYLE.md: C++ (sunlight's guide) and Lua (Scarab's own rules), measured
      # by scripts/style_audit.py - any finding of an enforced rule fails (plans/MASTER_PLAN.md item S2c).
      # Linux only, after configure: the documentation rule reads sunlight's headers from build/_deps.
      - name: Style check
        if: runner.os == 'Linux'
        run: python3 scripts/style_audit.py --check

      # Scarab's unit tests (doctest, tests/): what needs no window - the sprite and font
      # pools, LuaEngineUtil's argument readers, the zoom rule, content encryption -
      # plans/MASTER_PLAN.md item R2.
      - name: Unit tests (Linux/macOS)
        if: runner.os != 'Windows'
        run: ./build/scarab_tests

      - name: Unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & build/Release/scarab_tests.exe
          if ($LASTEXITCODE -ne 0) { throw "unit tests exited with code $LASTEXITCODE" }

      # --headless runs the game on sunlight's null renderer: no window, no
      # GPU - so, unlike everything before this step, it can actually RUN
      # the freshly built scarab on a display-less CI runner. The script
      # succeeds only by quitting itself (virtual clock, os.time/os.clock
      # overrides and null input all checked - see its own header); the
      # second run proves a budget that's too short fails with exit code 3
      # instead of passing.
      - name: Headless smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/scarab --headless --fast --max-frames 1000 scripts/headless_smoke/project.json
          rc=0
          ./build/scarab --headless --fast --max-frames 50 scripts/headless_smoke/project.json || rc=$?
          test "$rc" = "3"

      - name: Headless smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & build/Release/scarab.exe --headless --fast --max-frames 1000 scripts/headless_smoke/project.json
          if ($LASTEXITCODE -ne 0) { throw "headless smoke test exited with code $LASTEXITCODE (expected 0)" }
          & build/Release/scarab.exe --headless --fast --max-frames 50 scripts/headless_smoke/project.json
          if ($LASTEXITCODE -ne 3) { throw "budget-exhausted run exited with code $LASTEXITCODE (expected 3)" }
          # pwsh steps exit with the LAST native command's code, and that last command
          # deliberately exited 3 (asserted just above) - without this the step itself
          # would fail with a code that means "the check passed".
          exit 0

      # A map with EXTERNAL tilesets (.tsx) must load from a packed project with no
      # loose copy anywhere reachable: plain .zip, then an ENCRYPTED --pack of the
      # same project (this build has SCARAB_CONTENT_KEY configured, so --pack works).
      # Regression test for the bug where libtmx opened .tsx straight from the OS
      # path instead of through SunLight::FileSystem - see the script's own header.
      - name: Tileset archive smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/tileset_archive_smoke.py build/scarab --require-encrypted

      - name: Tileset archive smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/tileset_archive_smoke.py build/Release/scarab.exe --require-encrypted
          if ($LASTEXITCODE -ne 0) { throw "tileset archive smoke test exited with code $LASTEXITCODE" }

      # renderer_create / renderer_get_* / renderer_destroy: every option round-trips through
      # renderer_get_config, every rejection returns the exact reason, the lazy default and the
      # ordering-rule error work, and renderer-free calls create nothing. One headless run per
      # scenario (a process gets exactly one renderer) - see the script's own header.
      - name: Renderer API smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/renderer_api_smoke.py build/scarab

      - name: Renderer API smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/renderer_api_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "renderer API smoke test exited with code $LASTEXITCODE" }

      # camera_move_* / view_move_camera_*: the camera stops exactly on the map's far edge
      # (a partial last step) and comes back to exactly 0, at zoom 3.8125 and 1.0, on the
      # default view and an extra view - see the script's own header.
      - name: Camera boundary smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/camera_boundary_smoke.py build/scarab

      - name: Camera boundary smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/camera_boundary_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "camera boundary smoke test exited with code $LASTEXITCODE" }

      # BLEND_MODE_*, draw_begin/end_blend_mode, sprite_set/clear/get_blend_mode: values, round
      # trips, every error, a recycled sprite never inheriting a mode, and a begin with no end
      # being harmless across frames - see the script's own header.
      - name: Blend API smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/blend_api_smoke.py build/scarab

      - name: Blend API smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/blend_api_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "blend API smoke test exited with code $LASTEXITCODE" }

      # tilemap_get_layer / tilemap_set_layer: a layer's opacity is 0..255 (255 = opaque), the
      # authored 0.69/0.65 layers read 176/166, exact round trips, clamping, and a write-back
      # that changes nothing - see the script's own header.
      - name: Tilemap layer smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/tilemap_layer_smoke.py build/scarab

      - name: Tilemap layer smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/tilemap_layer_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "tilemap layer smoke test exited with code $LASTEXITCODE" }

      # KEY_* / GAMEPAD_BUTTON_* / GAMEPAD_AXIS_* / CONTROLLER_*: every constant of sunlight's
      # input enums (read from the fetched build/_deps/sunlight-src) is registered by
      # luainputapi.cpp and nothing else, no two in a group share a value, and KEY_MENU is 5
      # (it used to be 82, KEY_R's own number) - see the script's own header.
      - name: Input constants smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/input_constants_smoke.py build/scarab

      - name: Input constants smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/input_constants_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "input constants smoke test exited with code $LASTEXITCODE" }

      # load_font / release_font / set_font (path, handle, nil) / register_font / unregister_font
      # and draw_text / measure_text's optional font: every round trip and every error, a released
      # handle never breaking a font still in use, and no stale handle after slot reuse - see the
      # script's own header.
      - name: Font API smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/font_api_smoke.py build/scarab

      - name: Font API smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/font_api_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "font API smoke test exited with code $LASTEXITCODE" }

      # Every Lua function that can fail returns nil + the reason (never a Lua error, never a
      # silent no-op), a function with nothing else to return returns true, and arguments are
      # checked strictly - one check per kind of failure of every module (plans/MASTER_PLAN.md
      # item D3) - see the script's own header.
      - name: Error reporting smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/error_reporting_smoke.py build/scarab

      - name: Error reporting smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/error_reporting_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "error reporting smoke test exited with code $LASTEXITCODE" }

      # tilemap_unload_map unloads every sprite on a layer and takes their colliders out: no
      # collision while the map is unloaded, exactly one per frame after the sprites are added
      # again (plans/MASTER_PLAN.md item V9) - see the script's own header.
      - name: Unload map smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/unload_map_smoke.py build/scarab

      - name: Unload map smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/unload_map_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "unload map smoke test exited with code $LASTEXITCODE" }

      # tilemap_load_map over a loaded map: a map that fails to parse leaves the loaded one loaded,
      # sprites stay registered, and 1000 loads don't grow peak memory over 20 (Linux/macOS; the
      # functional checks only on Windows) - plans/MASTER_PLAN.md item V10, see the script's header.
      - name: Load map smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/load_map_smoke.py build/scarab

      - name: Load map smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/load_map_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "load map smoke test exited with code $LASTEXITCODE" }

      # Sprite-vs-tile collisions and tile lookups in map space: exact collision windows (view-
      # relative and world-space, camera offset, zoom 1 and 3.8125), the tile's map rectangle, one
      # call per touched tile, two collision shapes, the far edge - plans/MASTER_PLAN.md item V11.
      - name: Tile collision smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/tile_collision_smoke.py build/scarab

      - name: Tile collision smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/tile_collision_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "tile collision smoke test exited with code $LASTEXITCODE" }

      # tilemap_get/set_layer_tint (+ _by_name): every authored Tiled tintcolor read back exactly
      # (alpha included) for tile, image, object and group layers, set then get, a write-back
      # changing nothing, and every error - plans/MASTER_PLAN.md item V12.
      - name: Layer tint smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/layer_tint_smoke.py build/scarab

      - name: Layer tint smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/layer_tint_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "layer tint smoke test exited with code $LASTEXITCODE" }

      # sprite_set/get_opacity and sprite_set/get_tint: defaults, exact round trips, every
      # rejection, two sprites sharing a texture keeping their own values, a recycled slot
      # starting opaque and untinted - plans/MASTER_PLAN.md item P8.
      - name: Sprite tint smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/sprite_tint_smoke.py build/scarab

      - name: Sprite tint smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/sprite_tint_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "sprite tint smoke test exited with code $LASTEXITCODE" }

      # tilemap_get_tile_frame / tilemap_get_object_tile_frame: a Tiled tile animation runs by
      # time (frame = time since tilemap_load_map modulo the cycle), every copy in step, no pause
      # while hidden or off screen, checked exactly every frame for 11 cycles - plans/MASTER_PLAN.md
      # item V13.
      - name: Tile animation smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/tile_animation_smoke.py build/scarab

      - name: Tile animation smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/tile_animation_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "tile animation smoke test exited with code $LASTEXITCODE" }

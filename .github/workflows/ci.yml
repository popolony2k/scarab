name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lua-api-docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Check every Lua-callable primitive is tagged for docs generation
        run: python3 scripts/generate_lua_api_docs.py

  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zlib1g-dev \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Windows dependencies (zlib, iconv via vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install zlib:x64-windows libiconv:x64-windows

      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          SCARAB_CI_CONTENT_KEY: ${{ secrets.SCARAB_CI_CONTENT_KEY }}
        run: cmake -B build -S . -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSCARAB_CONTENT_KEY="$SCARAB_CI_CONTENT_KEY"

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SCARAB_CI_CONTENT_KEY: ${{ secrets.SCARAB_CI_CONTENT_KEY }}
        run: cmake -B build -S . "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DSCARAB_CONTENT_KEY=$env:SCARAB_CI_CONTENT_KEY"

      - name: Verify SCARAB_CONTENT_KEY actually configured (Linux/macOS)
        if: runner.os != 'Windows'
        # Checks the cached value's own LENGTH only (64 hex chars expected) -
        # never the value itself, so nothing here can leak the secret even
        # by accident. ci.yml has no test/run step to otherwise prove the
        # secret really flowed through (a silently-empty key would build
        # identically to a real one - no visible difference in this log
        # either way) - this is what actually closes that gap.
        run: |
          KEY_LEN=$(grep '^SCARAB_CONTENT_KEY:STRING=' build/CMakeCache.txt | cut -d= -f2 | tr -d '\n' | wc -c | tr -d ' ')
          echo "SCARAB_CONTENT_KEY configured length: $KEY_LEN (expected 64)"
          if [ "$KEY_LEN" != "64" ]; then
            echo "::error::SCARAB_CONTENT_KEY is not a 64-hex-char value - SCARAB_CI_CONTENT_KEY secret missing/misconfigured?"
            exit 1
          fi

      - name: Verify SCARAB_CONTENT_KEY actually configured (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $match = Select-String -Path build\CMakeCache.txt -Pattern '^SCARAB_CONTENT_KEY:STRING='
          # .Line is the matched line's own raw text ("SCARAB_CONTENT_KEY:STRING=<value>") -
          # $match itself is a MatchInfo object, and stringifying THAT directly (eg. via
          # -replace on $match rather than $match.Line) yields PowerShell's own
          # "<path>:<linenumber>:<line text>" representation instead, inflating the
          # length by that prefix - a real bug caught live via this exact check
          # (reported 134, not 64, on the very first CI run).
          $keyLen = ($match.Line -replace '^SCARAB_CONTENT_KEY:STRING=', '').Length
          Write-Host "SCARAB_CONTENT_KEY configured length: $keyLen (expected 64)"
          if ($keyLen -ne 64) {
            Write-Host "::error::SCARAB_CONTENT_KEY is not a 64-hex-char value - SCARAB_CI_CONTENT_KEY secret missing/misconfigured?"
            exit 1
          }

      - name: Build
        run: cmake --build build --config Release -j 4

      # --headless runs the game on sunlight's null renderer: no window, no
      # GPU - so, unlike everything before this step, it can actually RUN
      # the freshly built scarab on a display-less CI runner. The script
      # succeeds only by quitting itself (virtual clock, os.time/os.clock
      # overrides and null input all checked - see its own header); the
      # second run proves a budget that's too short fails with exit code 3
      # instead of passing.
      - name: Headless smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          ./build/scarab --headless --fast --max-frames 1000 scripts/headless_smoke/project.json
          rc=0
          ./build/scarab --headless --fast --max-frames 50 scripts/headless_smoke/project.json || rc=$?
          test "$rc" = "3"

      - name: Headless smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & build/Release/scarab.exe --headless --fast --max-frames 1000 scripts/headless_smoke/project.json
          if ($LASTEXITCODE -ne 0) { throw "headless smoke test exited with code $LASTEXITCODE (expected 0)" }
          & build/Release/scarab.exe --headless --fast --max-frames 50 scripts/headless_smoke/project.json
          if ($LASTEXITCODE -ne 3) { throw "budget-exhausted run exited with code $LASTEXITCODE (expected 3)" }
          # pwsh steps exit with the LAST native command's code, and that last command
          # deliberately exited 3 (asserted just above) - without this the step itself
          # would fail with a code that means "the check passed".
          exit 0

      # A map with EXTERNAL tilesets (.tsx) must load from a packed project with no
      # loose copy anywhere reachable: plain .zip, then an ENCRYPTED --pack of the
      # same project (this build has SCARAB_CONTENT_KEY configured, so --pack works).
      # Regression test for the bug where libtmx opened .tsx straight from the OS
      # path instead of through SunLight::FileSystem - see the script's own header.
      - name: Tileset archive smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/tileset_archive_smoke.py build/scarab --require-encrypted

      - name: Tileset archive smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/tileset_archive_smoke.py build/Release/scarab.exe --require-encrypted
          if ($LASTEXITCODE -ne 0) { throw "tileset archive smoke test exited with code $LASTEXITCODE" }

      # renderer_create / renderer_get_* / renderer_destroy: every option round-trips through
      # renderer_get_config, every rejection returns the exact reason, the lazy default and the
      # ordering-rule error work, and renderer-free calls create nothing. One headless run per
      # scenario (a process gets exactly one renderer) - see the script's own header.
      - name: Renderer API smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: python3 scripts/renderer_api_smoke.py build/scarab

      - name: Renderer API smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/renderer_api_smoke.py build/Release/scarab.exe
          if ($LASTEXITCODE -ne 0) { throw "renderer API smoke test exited with code $LASTEXITCODE" }

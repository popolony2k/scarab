name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            archive_ext: tar.gz
          - os: macos-latest
            platform: macos-arm64
            archive_ext: tar.gz
          - os: macos-15-intel
            platform: macos-x64
            archive_ext: tar.gz
          - os: windows-latest
            platform: windows-x64
            archive_ext: zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            zlib1g-dev \
            libasound2-dev \
            libx11-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libglu1-mesa-dev \
            libxcursor-dev \
            libxinerama-dev \
            libwayland-dev \
            libxkbcommon-dev

      - name: Install Windows dependencies (zlib, iconv via vcpkg)
        if: runner.os == 'Windows'
        shell: pwsh
        run: vcpkg install zlib:x64-windows libiconv:x64-windows

      # SCARAB_CONTENT_KEY for these PUBLIC release binaries: deliberately
      # NOT a fixed/shared value (see README.md's own "Content encryption"
      # section for the full "as-is, educational only" framing) - derived
      # fresh per release as HMAC-SHA256(a persistent, never-compiled-in
      # secret salt, this release's own tag name). Cryptographically
      # indistinguishable from random to anyone without the salt, changes
      # automatically every release (the tag itself changes), yet every
      # one of this job's 4 platform matrix entries computes the exact
      # same value independently (same salt + same tag -> same output,
      # zero cross-job coordination needed) - so any platform's official
      # vX.Y.Z release can read content packed by any OTHER platform's
      # official vX.Y.Z release. HMAC-SHA256's own output is exactly 32
      # bytes (64 hex chars) - already the exact format
      # SCARAB_CONTENT_KEY needs, no truncation/padding required.
      #
      # ::add-mask:: registers the COMPUTED value for log redaction -
      # GitHub only auto-masks the literal registered secret
      # (SCARAB_RELEASE_KEY_SALT itself), not a value derived from it, so
      # without this the derived key wouldn't be protected in this job's
      # own later log output the way a raw secrets.* reference would be.
      - name: Configure (Linux/macOS)
        if: runner.os != 'Windows'
        env:
          SCARAB_RELEASE_KEY_SALT: ${{ secrets.SCARAB_RELEASE_KEY_SALT }}
        run: |
          DERIVED_KEY=$(python3 -c "import hmac, hashlib, sys; print(hmac.new(sys.argv[1].encode(), sys.argv[2].encode(), hashlib.sha256).hexdigest())" "$SCARAB_RELEASE_KEY_SALT" "${{ github.ref_name }}")
          echo "::add-mask::$DERIVED_KEY"
          cmake -B build -S . -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DSCARAB_CONTENT_KEY="$DERIVED_KEY" -DSCARAB_CONTENT_KEY_IS_SHARED=ON

      - name: Configure (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          SCARAB_RELEASE_KEY_SALT: ${{ secrets.SCARAB_RELEASE_KEY_SALT }}
        run: |
          # Windows GitHub-hosted runners only guarantee `python` on PATH,
          # not `python3` (confirmed against actions/runner-images' own
          # Windows software manifest before relying on this).
          $derivedKey = python -c "import hmac, hashlib, sys; print(hmac.new(sys.argv[1].encode(), sys.argv[2].encode(), hashlib.sha256).hexdigest())" "$env:SCARAB_RELEASE_KEY_SALT" "${{ github.ref_name }}"
          Write-Host "::add-mask::$derivedKey"
          cmake -B build -S . "-DCMAKE_POLICY_VERSION_MINIMUM=3.5" "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" "-DSCARAB_CONTENT_KEY=$derivedKey" "-DSCARAB_CONTENT_KEY_IS_SHARED=ON"

      - name: Verify SCARAB_CONTENT_KEY actually configured (Linux/macOS)
        if: runner.os != 'Windows'
        # Same length-only check as ci.yml's own equivalent step - proves
        # the derivation actually produced a real 64-hex-char value
        # (rather than eg. an empty SCARAB_RELEASE_KEY_SALT silently
        # deriving SOME value from an empty salt) without ever printing
        # the value itself.
        run: |
          KEY_LEN=$(grep '^SCARAB_CONTENT_KEY:STRING=' build/CMakeCache.txt | cut -d= -f2 | tr -d '\n' | wc -c | tr -d ' ')
          echo "SCARAB_CONTENT_KEY configured length: $KEY_LEN (expected 64)"
          if [ "$KEY_LEN" != "64" ]; then
            echo "::error::SCARAB_CONTENT_KEY is not a 64-hex-char value - derivation or SCARAB_RELEASE_KEY_SALT secret misconfigured?"
            exit 1
          fi

      - name: Verify SCARAB_CONTENT_KEY actually configured (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $match = Select-String -Path build\CMakeCache.txt -Pattern '^SCARAB_CONTENT_KEY:STRING='
          $keyLen = ($match.Line -replace '^SCARAB_CONTENT_KEY:STRING=', '').Length
          Write-Host "SCARAB_CONTENT_KEY configured length: $keyLen (expected 64)"
          if ($keyLen -ne 64) {
            Write-Host "::error::SCARAB_CONTENT_KEY is not a 64-hex-char value - derivation or SCARAB_RELEASE_KEY_SALT secret misconfigured?"
            exit 1
          }

      - name: Build
        run: cmake --build build --config Release -j 4

      # Scarab has no cmake --install target (see CMakeLists.txt) - unlike
      # sunlight, it's an executable, not an installable library, and
      # scarab_copy_binaries already assembles a complete, ready-to-run
      # bundle (the scarab executable + raylib/tmx/libxml2/sunlight's shared
      # libs) directly next to the built executable at build time, via
      # $<TARGET_FILE_DIR:scarab>. That target resolves to build/ itself on
      # Linux/macOS (single-config Unix Makefiles - no per-config
      # subdirectory), and to build/Release/ on Windows (the VS generator
      # GitHub's windows-latest runner defaults to is multi-config) - see
      # this repo's own CLAUDE.md "Known gotchas" for the fuller story on
      # why that split exists. Staging just copies the executable plus
      # whatever shared-lib files actually landed next to it, rather than
      # naming each dependency explicitly (their exact filenames can shift
      # with FetchContent'd versions).
      - name: Stage artifact (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p scarab-${{ github.ref_name }}-${{ matrix.platform }}
          cp build/scarab scarab-${{ github.ref_name }}-${{ matrix.platform }}/
          cp build/*.so* scarab-${{ github.ref_name }}-${{ matrix.platform }}/ 2>/dev/null || true

      - name: Stage artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p scarab-${{ github.ref_name }}-${{ matrix.platform }}
          cp build/scarab scarab-${{ github.ref_name }}-${{ matrix.platform }}/
          cp build/*.dylib scarab-${{ github.ref_name }}-${{ matrix.platform }}/ 2>/dev/null || true

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path scarab-${{ github.ref_name }}-${{ matrix.platform }}
          Copy-Item build/Release/scarab.exe scarab-${{ github.ref_name }}-${{ matrix.platform }}/
          Copy-Item build/Release/*.dll scarab-${{ github.ref_name }}-${{ matrix.platform }}/ -ErrorAction SilentlyContinue

      # Confirms the staged files actually run once relocated OUTSIDE the
      # build tree - not a redundant re-check of "Build" above, which never
      # leaves the build tree at all. A real bug this caught live
      # (2026-08-29): scarab's own executable/shared libs looked fine right
      # after Build, but failed with "Library not loaded: @rpath/..." the
      # moment the released archive was extracted anywhere else - CMake's
      # default rpath bakes in the build tree's own absolute paths, which
      # don't exist outside the machine that built it. Fixed via
      # BUILD_WITH_INSTALL_RPATH/@loader_path+$ORIGIN in the root
      # CMakeLists.txt; this step exists so a regression there (or an
      # equivalent problem on Linux/Windows this session couldn't test
      # locally) fails CI loudly instead of shipping silently broken again.
      - name: Smoke test (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          cp -r scarab-${{ github.ref_name }}-${{ matrix.platform }} /tmp/scarab-smoketest
          cd /tmp/scarab-smoketest
          ./scarab --help

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Copy-Item -Recurse "scarab-${{ github.ref_name }}-${{ matrix.platform }}" "$env:TEMP\scarab-smoketest"
          & "$env:TEMP\scarab-smoketest\scarab.exe" --help
          if ($LASTEXITCODE -ne 0) { throw "scarab.exe --help exited with code $LASTEXITCODE" }

      - name: Package (Linux/macOS)
        if: runner.os != 'Windows'
        run: tar -czf scarab-${{ github.ref_name }}-${{ matrix.platform }}.tar.gz scarab-${{ github.ref_name }}-${{ matrix.platform }}

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path scarab-${{ github.ref_name }}-${{ matrix.platform }} -DestinationPath scarab-${{ github.ref_name }}-${{ matrix.platform }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: scarab-${{ matrix.platform }}
          path: scarab-${{ github.ref_name }}-${{ matrix.platform }}.${{ matrix.archive_ext }}
          if-no-files-found: error

  release:
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/* \
            --title "scarab ${{ github.ref_name }}" \
            --generate-notes
